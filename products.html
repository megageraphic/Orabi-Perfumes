<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة عرابي للعطور - Orabi Perfumes Menu</title>
    <!-- أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- خط الرقعة Aref Ruqaa من خطوط جوجل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa771c;
            --green-total: #25d366;
            --text-light: #ffffff;
            --text-muted: #d1d1d1;
            --card-bg: rgba(22, 22, 22, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Aref Ruqaa', 'Segoe UI', serif;
        }

        /* خلفية تموجية فاخرة للصفحة */
        body {
            min-height: 100vh;
            color: var(--text-light);
            background: linear-gradient(-45deg, #000000, #1a1505, #0b0b0b, #2a2008, #111111);
            background-size: 400% 400%;
            animation: gradientWave 12s ease infinite;
            padding: 2rem 0 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes gradientWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* الهيدر والعنوان الرئيسي */
        header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 0 1rem;
        }

        header h1 {
            font-size: 3.2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            font-weight: 700;
        }

        header p {
            color: var(--gold-light);
            font-size: 1.3rem;
            letter-spacing: 0.5px;
        }

        /* حاوي المنيو مع خلفية الصورة 15.png */
        .menu-container {
            width: 100%;
            max-width: 700px;
            padding: 0 1rem;
        }

        .menu-card {
            background: linear-gradient(rgba(15, 15, 15, 0.85), rgba(15, 15, 15, 0.85)), url('15.png') no-repeat center center;
            background-size: cover;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }

        /* جدول المنيو */
        .menu-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
        }

        .menu-table th {
            color: var(--gold-primary);
            font-size: 1.5rem;
            font-weight: bold;
            padding: 12px 10px;
            text-align: center;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            background: rgba(0, 0, 0, 0.4);
        }

        .menu-table th.col-name {
            text-align: center;
            width: 38%;
        }

        .menu-table th.col-size {
            width: 31%;
            text-align: center;
        }

        .menu-table tr td {
            background: rgba(25, 25, 25, 0.85);
            padding: 14px 10px;
            text-align: center;
            vertical-align: middle;
            border-top: 1px solid rgba(212, 175, 55, 0.25);
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            transition: background 0.3s ease;
        }

        .menu-table tr:hover td {
            background: rgba(40, 40, 40, 0.95);
        }

        .menu-table tr td:first-child {
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
            border-right: 3px solid var(--gold-primary);
            text-align: center;
            padding-right: 10px;
            font-weight: bold;
            font-size: 1.4rem;
            color: #ffffff;
        }

        .menu-table tr td:last-child {
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
            border-left: 1px solid rgba(212, 175, 55, 0.25);
        }

        .price-text {
            color: var(--gold-light);
            font-weight: bold;
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        /* أزرار الكمية التفاعلية */
        .qty-control {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--gold-primary);
            border-radius: 20px;
            padding: 3px 10px;
            font-family: sans-serif;
        }

        .qty-btn {
            background: none;
            border: none;
            color: var(--gold-primary);
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s, color 0.2s;
        }

        .qty-btn:hover {
            background: var(--gold-primary);
            color: #000;
        }

        .qty-val {
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        /* شريط إجمالي المبلغ باللون الأخضر */
        .total-price-box {
            margin-top: 1.5rem;
            padding: 12px 20px;
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid var(--green-total);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.25);
        }

        .total-price-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .total-price-label i {
            color: var(--green-total);
            font-size: 1.5rem;
        }

        .total-price-amount {
            color: var(--green-total);
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(37, 211, 102, 0.5);
            font-family: sans-serif;
        }

        /* قسم بيانات العميل أسفل المنيو */
        .customer-info-section {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 2px dashed rgba(212, 175, 55, 0.4);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .customer-info-title {
            color: var(--gold-light);
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group i {
            position: absolute;
            right: 15px;
            color: var(--gold-primary);
            font-size: 1.2rem;
        }

        .input-control {
            width: 100%;
            padding: 12px 45px 12px 15px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-control:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .input-control::placeholder {
            color: #888888;
        }

        /* زر إرسال الطلب عبر الواتساب */
        .btn-send-whatsapp {
            width: 100%;
            margin-top: 1rem;
            padding: 14px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 5px 20px rgba(37, 211, 102, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn-send-whatsapp:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.6);
        }

        /* زر العودة للرئيسية */
        .btn-back {
            margin-top: 2rem;
            margin-bottom: 3rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728);
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            cursor: pointer;
        }

        .btn-back:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.7);
        }

        /* الأيقونات الثابتة العائمة */
        .floating-contact-container {
            position: fixed;
            bottom: 30px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 9999;
        }

        .floating-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 1.7rem;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .btn-whatsapp-float {
            background-color: #25d366;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.5);
            animation: pulseGreen 2s infinite;
        }

        .btn-phone-float {
            background: linear-gradient(135deg, #bf953f, #d4af37, #aa771c);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.5);
            animation: pulseGold 2s infinite 0.5s;
        }

        .floating-btn:hover {
            transform: scale(1.12);
        }

        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { box-shadow: 0 0 0 18px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        @keyframes pulseGold {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.8); }
            70% { box-shadow: 0 0 0 18px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        /* الفوتر */
        footer {
            width: 100%;
            background-color: rgba(5, 5, 5, 0.95);
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            padding: 1.8rem 1rem;
            text-align: center;
            color: #a0a0a0;
            font-size: 1rem;
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        footer p {
            margin: 0;
            color: #d1d1d1;
        }

        .footer-credits {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .footer-credits span {
            font-size: 0.9rem;
            color: #f3e5ab;
        }

        .footer-credits img {
            height: 28px;
            width: auto;
            object-fit: contain;
        }

        .footer-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: #fff;
            text-decoration: none;
            font-size: 0.85rem;
            transition: transform 0.3s ease;
        }

        .footer-btn.phone-btn {
            background: linear-gradient(135deg, #bf953f, #d4af37);
        }

        .footer-btn.whatsapp-btn {
            background-color: #25d366;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2.5rem; }
            .menu-table th { font-size: 1.2rem; }
            .menu-table tr td:first-child { font-size: 1.2rem; }
            .price-text { font-size: 1.1rem; }
            .qty-control { padding: 2px 6px; }
            .qty-btn { font-size: 0.95rem; width: 20px; height: 20px; }
            .total-price-label { font-size: 1.2rem; }
            .total-price-amount { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <h1>عرابي للعطور</h1>
        <p>قائمة العطور الفاخرة والأسعار</p>
    </header>

    <!-- قائمة المنيو التفاعلية خلفها صورة 15.png -->
    <main class="menu-container">
        <div class="menu-card">
            <table class="menu-table">
                <thead>
                    <tr>
                        <th class="col-name">العطر</th>
                        <th class="col-size">30 ملي</th>
                        <th class="col-size">50 ملي</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- سوفاج -->
                    <tr data-name="سوفاج">
                        <td>سوفاج</td>
                        <td>
                            <div class="price-text">150 ج</div>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
                                <span class="qty-val" data-size="30ملي" data-price="150">0</span>
                                <button class="qty-btn" onclick="changeQty(this, -1)">-</button>
                            </div>
                        </td>
                        <td>
                            <div class="price-text">250 ج</div>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
                                <span class="qty-val" data-size="50ملي" data-price="250">0</span>
                                <button class="qty-btn" onclick="changeQty(this, -1)">-</button>
                            </div>
                        </td>
                    </tr>

                    <!-- وأي -->
                    <tr data-name="وأي (Y)">
                        <td>وأي (Y)</td>
                        <td>
                            <div class="price-text">150 ج</div>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
                                <span class="qty-val" data-size="30ملي" data-price="150">0</span>
                                <button class="qty-btn" onclick="changeQty(this, -1)">-</button>
                            </div>
                        </td>
                        <td>
                            <div class="price-text">250 ج</div>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
                                <span class="qty-val" data-size="50ملي" data-price="250">0</span>
                                <button class="qty-btn" onclick="changeQty(this, -1)">-</button>
                            </div>
                        </td>
                    </tr>

                    <!-- انفكتس -->
                    <tr data-name="انفكتس">
                        <td>انفكتس</td>
                        <td>
                            <div class="price-text">150 ج</div>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
                                <span class="qty-val" data-size="30ملي" data-price="150">0</span>
                                <button class="qty-btn" onclick="changeQty(this, -1)">-</button>
                            </div>
                        </td>
                        <td>
                            <div class="price-text">250 ج</div>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
                                <span class="qty-val" data-size="50ملي" data-price="250">0</span>
                                <button class="qty-btn" onclick="changeQty(this, -1)">-</button>
                            </div>
                        </td>
                    </tr>

                    <!-- لومال الكسير -->
                    <tr data-name="لومال الكسير">
                        <td>لومال الكسير</td>
                        <td>
                            <div class="price-text">150 ج</div>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
                                <span class="qty-val" data-size="30ملي" data-price="150">0</span>
                                <button class="qty-btn" onclick="changeQty(this, -1)">-</button>
                            </div>
                        </td>
                        <td>
                            <div class="price-text">250 ج</div>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
                                <span class="qty-val" data-size="50ملي" data-price="250">0</span>
                                <button class="qty-btn" onclick="changeQty(this, -1)">-</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- مربع إجمالي المبلغ باللون الأخضر أسفل الجدول -->
            <div class="total-price-box">
                <div class="total-price-label">
                    <i class="fas fa-calculator"></i>
                    إجمالي المبلغ:
                </div>
                <div class="total-price-amount" id="total-amount-display">0 ج</div>
            </div>

            <!-- قسم بيانات التوصيل والتوصيل أسفل المنيو -->
            <div class="customer-info-section">
                <div class="customer-info-title">بيانات الطلب والتوصيل</div>
                
                <!-- خانة الاسم -->
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="cust-name" class="input-control" placeholder="الاسم الكامل">
                </div>

                <!-- خانة الهاتف -->
                <div class="input-group">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="cust-phone" class="input-control" placeholder="رقم الهاتف">
                </div>

                <!-- خانة العنوان -->
                <div class="input-group">
                    <i class="fas fa-location-dot"></i>
                    <input type="text" id="cust-address" class="input-control" placeholder="عنوان التوصيل التفصيلي">
                </div>

                <!-- زر إرسال الطلب عبر الواتساب -->
                <button class="btn-send-whatsapp" onclick="sendOrderToWhatsApp()">
                    <i class="fab fa-whatsapp"></i>
                    إرسال الطلب عبر الواتساب
                </button>
            </div>
        </div>
    </main>

    <!-- زر الرجوع للرئيسية -->
    <a href="index.html" class="btn-back">
        <i class="fas fa-arrow-right"></i>
        الرجوع للرئيسية
    </a>

    <!-- الأيقونات العائمة -->
    <div class="floating-contact-container">
        <a href="https://wa.me/201035234373" target="_blank" class="floating-btn btn-whatsapp-float" title="تواصل عبر الواتساب">
            <i class="fab fa-whatsapp"></i>
        </a>
        <a href="tel:01035234373" class="floating-btn btn-phone-float" title="اتصل بنا">
            <i class="fas fa-phone"></i>
        </a>
    </div>

    <!-- الفوتر -->
    <footer>
        <p>&copy; جميع الحقوق محفوظة - عرابي للعطور</p>
        <div class="footer-credits">
            <span>تصميم بواسطة</span>
            <img src="100.png" alt="شعار التصميم">
            <a href="tel:01010255123" class="footer-btn phone-btn" title="اتصال هاتفي"><i class="fa-solid fa-phone"></i></a>
            <a href="https://wa.me/201010255123" target="_blank" class="footer-btn whatsapp-btn" title="مراسلة عبر الواتساب"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
    </footer>

    <!-- ملف السكربت الخارجي لإرسال الطلب وتحديث الإجمالي -->
    <script src="whatsapp-order.js"></script>
</body>
</html>
